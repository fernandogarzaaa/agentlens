name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # The LangGraph adapter test runs when the extra is installed and is skipped otherwise.
      - run: pip install -e ".[dev,langgraph]"
      - run: pytest -q

  regression-gate:
    # The quickstart as a real CI gate: eval with the offline mock model, then fail the job on a regression.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - run: |
          agentlens eval examples/travel_desk/suite.yaml --agent mock --mock-rules examples/travel_desk/mock_v1.yaml \
            --model mock-v1 --trace out/v1.jsonl --out out/v1.json --quiet
          agentlens gate out/v1.json --config examples/travel_desk/gate.toml --json out/gate.json
      - name: the gate must catch the deliberately regressed v2
        run: |
          agentlens eval examples/travel_desk/suite.yaml --agent mock --mock-rules examples/travel_desk/mock_v2.yaml \
            --model mock-v2 --out out/v2.json --quiet
          if agentlens gate out/v2.json --config examples/travel_desk/gate.toml; then echo "gate missed a regression"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate
          path: out/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: install the wheel in a clean venv and smoke test it
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/smoke/bin/agentlens --version
          /tmp/smoke/bin/python -c "import agentlens; t = agentlens.Tracer(); print(agentlens.__version__, len(agentlens.Pricing.default()))"
          /tmp/smoke/bin/agentlens eval "$GITHUB_WORKSPACE/examples/travel_desk/suite.yaml" --agent mock \
            --mock-rules "$GITHUB_WORKSPACE/examples/travel_desk/mock_v1.yaml" --model mock-v1 --limit 3 --quiet --out r.json
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agentlens:ci .
      - name: smoke test the trace viewer container
        run: |
          pip install .
          agentlens eval examples/travel_desk/suite.yaml --agent mock --mock-rules examples/travel_desk/mock_v1.yaml \
            --model mock-v1 --trace traces/traces.jsonl --quiet --out traces/r.json
          chmod -R a+rX traces
          docker run -d --name al -p 8000:8000 -v "$PWD/traces:/data:ro" agentlens:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/api/traces | python -c "import json,sys; t=json.load(sys.stdin); assert len(t) == 20, len(t); print(len(t), 'traces')"
          test "$(docker inspect -f '{{.Config.User}}' agentlens:ci)" = "agentlens"
          for i in $(seq 1 20); do s=$(docker inspect -f '{{.State.Health.Status}}' al); [ "$s" = healthy ] && break; sleep 3; done
          docker inspect -f '{{.State.Health.Status}}' al | grep -q healthy
          docker run --rm agentlens:ci agentlens --version
          docker rm -f al

  mutation:
    # Scoped and non-blocking: testteeth mutates only core functions (metrics, trajectory, cost, gate)
    # changed by this push / PR. Full grade: `make mutation`.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: testteeth (changed core functions)
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=HEAD~1; fi
          testteeth run --base "$BASE" --fail-under 80 --workers 2
